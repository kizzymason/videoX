<!doctype html>
<html lang="zh-CN" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var ua = navigator.userAgent || '';
        if (/iPad/i.test(ua)) return;
        if (
          !/(iPhone|iPod|Android.*Mobile|BlackBerry|IEMobile|Opera Mini|webOS|Windows Phone|HarmonyOS|Mobile Safari)/i.test(
            ua,
          )
        ) {
          return;
        }
        var path = location.pathname || '/';
        if (path === '/m' || path.indexOf('/m/') === 0 || path === '/admin' || path.indexOf('/admin/') === 0) return;
        location.replace('/m' + path + location.search + location.hash);
      })();
    </script>
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="PandaGV — 简约高级的视频平台" />
    <link rel="preconnect" href="http://localhost:4000" crossorigin />
    <title>PandaGV</title>
    <!--videox-head-->
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
