    <script>
      (function () {
        var ua = navigator.userAgent || '';
        if (/iPad/i.test(ua)) return;
        if (
          !/(iPhone|iPod|Android.*Mobile|BlackBerry|IEMobile|Opera Mini|webOS|Windows Phone|HarmonyOS|Mobile Safari)/i.test(
            ua,
          )
        ) {
          return;
        }
        var path = location.pathname || '/';
        if (path === '/m' || path.indexOf('/m/') === 0) return;
        location.replace('/m' + path + location.search + location.hash);
      })();
    </script>
    <meta name="theme-color" content="#0a0a0c" />
    <!-- 先上色再挂载：默认暗色，只有用户显式选过亮色才走亮色，避免首帧白闪。 -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('videox:theme');
          var dark = stored
            ? stored === 'dark' || (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
            : true;
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.classList.toggle('light', !dark);
          var color = dark ? '#0a0a0c' : '#ffffff';
          root.style.backgroundColor = color;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', color);
        } catch (e) {}
      })();
    </script>
