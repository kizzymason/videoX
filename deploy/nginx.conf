# videoX 生产反代：静态三端 + 同源 API / 媒体。
# 不要把浏览器指到 localhost:4000 或 Vite :5173。

upstream videox_api {
  server api:4000 max_fails=3 fail_timeout=10s;
  # 复用到 API 的长连接，省掉每个请求一次 TCP 握手。
  keepalive 128;
  keepalive_requests 10000;
  keepalive_timeout 60s;
}

# 分片是同一份文件被反复请求，磁盘缓存意义不大，但 manifest 值得挡一挡。
proxy_cache_path /var/cache/nginx/videox levels=1:2 keys_zone=videox_api:16m
                 max_size=512m inactive=10m use_temp_path=off;

server {
  listen 80 default_server backlog=8192;
  server_name _;
  client_max_body_size 2g;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";

  proxy_connect_timeout 5s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;
  proxy_buffer_size 16k;
  proxy_buffers 8 16k;
  proxy_busy_buffers_size 32k;

  location = /health {
    access_log off;
    proxy_pass http://videox_api;
  }

  # ^~ 不可省：下面按扩展名匹配静态资源的正则优先级高于普通前缀，
  # 否则 /media/assets/<id>/cover.jpg 会被当成前端静态文件去 html 目录里找。
  location ^~ /api/ {
    proxy_pass http://videox_api;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    # 压缩交给 nginx：Node 少一份 CPU 开销，前台接口延迟更稳。
    proxy_set_header Accept-Encoding "";
  }

  # 分片/清单由 API 鉴权后交回 nginx 用 sendfile 发（X-Accel-Redirect），
  # Node 只做鉴权不搬字节。
  location ^~ /media/ {
    proxy_pass http://videox_api;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  # API 鉴权通过后内部跳转到这里，直接读本地存储卷。外部无法直接访问。
  location ^~ /__accel/ {
    internal;
    alias /data/storage/;

    aio threads;
    directio 4m;
    output_buffers 4 256k;
    sendfile on;
    tcp_nopush on;

    access_log off;
  }

  location ^~ /static/ {
    proxy_pass http://videox_api;
  }

  location = /sitemap.xml {
    proxy_pass http://videox_api;
  }

  location = /robots.txt {
    proxy_pass http://videox_api;
  }

  location = /admin {
    return 301 /admin/;
  }

  location = /m {
    return 301 /m/;
  }

  root /usr/share/nginx/html;

  # vite 产物带内容哈希，可以放心长缓存；入口 HTML 必须每次回源判断。
  # 只用 add_header，不叠加 expires，否则会发出两个 Cache-Control。
  location ~* ^/(assets|m/assets|admin/assets)/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
  }

  location ~* \.(?:ico|png|jpg|jpeg|gif|webp|avif|svg|woff2?)$ {
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
  }

  location ~* \.(?:html|webmanifest)$ {
    add_header Cache-Control "no-cache";
  }

  location /admin/ {
    try_files $uri $uri/ /admin/index.html;
  }

  location /m/ {
    try_files $uri $uri/ /m/index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
