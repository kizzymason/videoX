# videoX 生产反代：静态三端 + 同源 API / 媒体。
# 只响应 pandagv.com / www.pandagv.com；裸 IP 与未知 Host 直接断开。
# 不要把浏览器指到 localhost:4000 或 Vite :5173。

upstream videox_api {
  server api:4000 max_fails=3 fail_timeout=10s;
  # 复用到 API 的长连接，省掉每个请求一次 TCP 握手。
  keepalive 128;
  keepalive_requests 10000;
  keepalive_timeout 60s;
}

# 分片是同一份文件被反复请求，磁盘缓存意义不大，但 manifest 值得挡一挡。
proxy_cache_path /var/cache/nginx/videox levels=1:2 keys_zone=videox_api:16m
                 max_size=512m inactive=10m use_temp_path=off;

# HTTP：正式域名 301 到 https://pandagv.com（www 一并归到 apex）。
server {
  listen 80;
  server_name pandagv.com www.pandagv.com;
  return 301 https://pandagv.com$request_uri;
}

# HTTP：IP / 未知 Host 不提供站点。/health 仅给容器探活（Host 是 127.0.0.1）。
server {
  listen 80 default_server backlog=8192;
  server_name _;

  location = /health {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    access_log off;
    include /etc/nginx/proxy-headers.conf;
    proxy_pass http://videox_api;
  }

  location / {
    return 444;
  }
}

# HTTPS：www 归到 apex，避免 cookie 按 Host 分裂。
server {
  listen 443 ssl;
  http2 on;
  server_name www.pandagv.com;
  include /etc/nginx/ssl-params.conf;
  include /etc/nginx/hsts.conf;
  return 301 https://pandagv.com$request_uri;
}

# HTTPS：裸 IP / 未知 SNI 不断开业务。仍要挂同一张证书，nginx 才能起来。
server {
  listen 443 ssl default_server;
  http2 on;
  server_name _;
  include /etc/nginx/ssl-params.conf;
  return 444;
}

# HTTPS：正式站点。
server {
  listen 443 ssl;
  http2 on;
  server_name pandagv.com;
  include /etc/nginx/ssl-params.conf;
  include /etc/nginx/videox-locations.conf;
}
