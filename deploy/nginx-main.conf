# videoX 生产 nginx 主配置。默认镜像自带的 nginx.conf 只有 1024 worker_connections、
# 关闭 gzip，扛不住视频站的并发，这里整体替换。

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  16384;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 手机打开电脑版路径时跳 /m。map 必须在 http 层。
    # iPad / Android 平板（UA 通常没有 Mobile）走电脑版，屏幕够用。
    # 与 apps/web-pc/index.html 里的兜底脚本保持同一套关键字。
    map $http_user_agent $is_mobile {
        default 0;
        "~*iPad" 0;
        "~*(iphone|ipod|android.*mobile|blackberry|iemobile|opera mini|webos|windows phone|harmonyos|mobile safari)" 1;
    }

    # HLS 分片与字幕，默认 mime.types 没有。
    types {
        video/iso.segment          m4s;
        application/vnd.apple.mpegurl  m3u8;
        text/vtt                   vtt;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time urt=$upstream_response_time';

    # 分片请求量极大，日志同步写盘会成为瓶颈，这里走缓冲 + 定时 flush。
    access_log  /var/log/nginx/access.log main buffer=64k flush=5s;

    sendfile        on;
    sendfile_max_chunk 512k;
    tcp_nopush      on;
    tcp_nodelay     on;
    aio             threads;

    keepalive_timeout   75s;
    keepalive_requests  10000;
    reset_timedout_connection on;

    client_body_timeout 60s;
    client_header_timeout 30s;
    send_timeout 60s;

    server_tokens off;

    # 首页与详情页会同时打开几十个小文件（图标、切片清单），缓存住 fd 省掉重复 open。
    open_file_cache          max=20000 inactive=120s;
    open_file_cache_valid    60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/vtt
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        application/vnd.apple.mpegurl
        image/svg+xml
        font/ttf
        font/otf;

    # 前端构建产物已经预压缩不了（vite 默认不出 .gz），这里只开动态 gzip。
    gzip_static off;

    include /etc/nginx/conf.d/*.conf;
}
