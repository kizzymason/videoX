# 站点 location，由 HTTPS 的 pandagv.com server 引入。
client_max_body_size 2g;

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;

include /etc/nginx/hsts.conf;

location = /health {
  access_log off;
  include /etc/nginx/proxy-headers.conf;
  proxy_pass http://videox_api;
}

# ^~ 不可省：下面按扩展名匹配静态资源的正则优先级高于普通前缀，
# 否则 /media/assets/<id>/cover.jpg 会被当成前端静态文件去 html 目录里找。
location ^~ /api/ {
  include /etc/nginx/proxy-headers.conf;
  # 压缩交给 nginx：Node 少一份 CPU 开销，前台接口延迟更稳。
  proxy_set_header Accept-Encoding "";
  proxy_pass http://videox_api;
  proxy_request_buffering off;
  proxy_read_timeout 3600s;
}

# 分片/清单由 API 鉴权后交回 nginx 用 sendfile 发（X-Accel-Redirect），
# Node 只做鉴权不搬字节。
location ^~ /media/ {
  include /etc/nginx/proxy-headers.conf;
  proxy_pass http://videox_api;
  proxy_buffering off;
  proxy_read_timeout 3600s;
}

# API 鉴权通过后内部跳转到这里，直接读本地存储卷。外部无法直接访问。
location ^~ /__accel/ {
  internal;
  alias /data/storage/;

  aio threads;
  directio 4m;
  output_buffers 4 256k;
  sendfile on;
  tcp_nopush on;

  access_log off;
}

location ^~ /static/ {
  include /etc/nginx/proxy-headers.conf;
  proxy_pass http://videox_api;
}

# sitemap 索引 + 全部子 sitemap（/sitemap-pages.xml、/sitemap-videos-N.xml 等）。
location ~ "^/sitemap[a-z0-9-]*\.xml$" {
  include /etc/nginx/proxy-headers.conf;
  proxy_pass http://videox_api;
}

location = /robots.txt {
  include /etc/nginx/proxy-headers.conf;
  proxy_pass http://videox_api;
}

# IndexNow 所有权校验文件 {key}.txt，由 API 按后台配置的 key 响应。
location ~ "^/[a-zA-Z0-9-]{8,128}\.txt$" {
  include /etc/nginx/proxy-headers.conf;
  proxy_pass http://videox_api;
}

# 爬虫动态渲染入口（由下方 $is_seo_bot rewrite 进来，也可直接访问用于排查）。
# 同一地址按 UA 给爬虫和真人发不同 HTML，属于动态供应，必须带 Vary: User-Agent，
# 否则中间缓存可能把爬虫版发给真人（Google 也明确要求这个响应头）。
location ^~ /__seo/ {
  include /etc/nginx/proxy-headers.conf;
  add_header Vary "User-Agent" always;
  include /etc/nginx/hsts.conf;
  proxy_pass http://videox_api;
}

location = /admins {
  return 301 /admins/;
}

location = /m {
  return 301 /m/;
}

root /usr/share/nginx/html;

# vite 产物带内容哈希，可以放心长缓存；入口 HTML 必须每次回源判断。
# 只用 add_header，不叠加 expires，否则会发出两个 Cache-Control。
# 后台产物落在 /_ap/ 下：路径里不带 admin 字样，光看资源 URL 猜不到入口。
location ~* ^/(assets|m/assets|_ap/assets|admins/assets)/ {
  add_header Cache-Control "public, max-age=31536000, immutable";
  include /etc/nginx/hsts.conf;
  access_log off;
  try_files $uri =404;
}

location ~* \.(?:ico|png|jpg|jpeg|gif|webp|avif|svg|woff2?)$ {
  add_header Cache-Control "public, max-age=2592000";
  include /etc/nginx/hsts.conf;
  access_log off;
}

location ~* \.(?:html|webmanifest)$ {
  add_header Cache-Control "no-cache";
  include /etc/nginx/hsts.conf;
}

# 后台入口。真实路径存在站点设置里（后台可改），nginx 不写死：
# 先按形态筛一遍（小写字母开头、含数字的单段路径 —— 前台路由全是纯字母，永不撞车），
# 再让 API 的 auth_request 判断是不是当前入口。命中就发后台入口 HTML，
# 没命中就当普通前台路径处理，外部分辨不出这个路径是否存在。
location ~ "^/(?<vx_entry_seg>[a-z](?=[a-z]*[0-9])[a-z0-9]{5,31})(?:/|$)" {
  limit_req zone=vx_entry burst=20 nodelay;

  auth_request /__vx-entry;
  # API 挂了也别把入口暴露成 500，一律退回前台。
  error_page 401 403 500 502 503 504 = @vx_public;

  add_header Cache-Control "no-store" always;
  include /etc/nginx/hsts.conf;
  try_files /_ap/index.html =404;
}

# 后台入口 HTML 只能由上面那条 location 在 auth_request 放行后发出，
# 直接摸产物目录一律 404。带哈希的 assets 与 favicon 不用藏，猜不到文件名也没有意义。
location = /_ap/ {
  return 404;
}

location = /_ap/index.html {
  return 404;
}

# auth_request 的判定端点，internal 保证只能由子请求进入。
location = /__vx-entry {
  internal;
  include /etc/nginx/proxy-headers.conf;
  proxy_pass http://videox_api/internal/admin-entry?seg=$vx_entry_seg;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
}

# 入口没命中时的退路：和 location / 的行为保持一致。
location @vx_public {
  include /etc/nginx/hsts.conf;
  add_header Vary "User-Agent" always;

  if ($is_seo_bot) {
    rewrite ^(.*)$ /__seo/render$1 last;
  }

  if ($is_mobile) {
    return 302 /m$request_uri;
  }

  try_files $uri $uri/ /index.html;
}

location /admins/ {
  try_files $uri $uri/ /admins/index.html;
}

location /m/ {
  # 搜索引擎爬虫拿服务端渲染的 HTML，真实用户走 SPA。
  if ($is_seo_bot) {
    rewrite ^(.*)$ /__seo/render$1 last;
  }

  try_files $uri $uri/ /m/index.html;
}

location / {
  # location 里任何 add_header 都会盖掉 server 级 HSTS，这里一并带上。
  include /etc/nginx/hsts.conf;
  add_header Vary "User-Agent" always;

  # 搜索引擎爬虫拿服务端渲染的 HTML，必须在移动端 302 之前判断。
  if ($is_seo_bot) {
    rewrite ^(.*)$ /__seo/render$1 last;
  }

  # if + return 是 nginx 允许的安全写法。/m 与后台入口由更具体的 location 接手，不会进这里。
  if ($is_mobile) {
    return 302 /m$request_uri;
  }

  try_files $uri $uri/ /index.html;
}
