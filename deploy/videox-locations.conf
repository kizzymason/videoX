# 站点 location，由 HTTPS 的 pandagv.com server 引入。
client_max_body_size 2g;

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;

include /etc/nginx/hsts.conf;

location = /health {
  access_log off;
  include /etc/nginx/proxy-headers.conf;
  proxy_pass http://videox_api;
}

# ^~ 不可省：下面按扩展名匹配静态资源的正则优先级高于普通前缀，
# 否则 /media/assets/<id>/cover.jpg 会被当成前端静态文件去 html 目录里找。
location ^~ /api/ {
  include /etc/nginx/proxy-headers.conf;
  # 压缩交给 nginx：Node 少一份 CPU 开销，前台接口延迟更稳。
  proxy_set_header Accept-Encoding "";
  proxy_pass http://videox_api;
  proxy_request_buffering off;
  proxy_read_timeout 3600s;
}

# 分片/清单由 API 鉴权后交回 nginx 用 sendfile 发（X-Accel-Redirect），
# Node 只做鉴权不搬字节。
location ^~ /media/ {
  include /etc/nginx/proxy-headers.conf;
  proxy_pass http://videox_api;
  proxy_buffering off;
  proxy_read_timeout 3600s;
}

# API 鉴权通过后内部跳转到这里，直接读本地存储卷。外部无法直接访问。
location ^~ /__accel/ {
  internal;
  alias /data/storage/;

  aio threads;
  directio 4m;
  output_buffers 4 256k;
  sendfile on;
  tcp_nopush on;

  access_log off;
}

location ^~ /static/ {
  include /etc/nginx/proxy-headers.conf;
  proxy_pass http://videox_api;
}

location = /sitemap.xml {
  include /etc/nginx/proxy-headers.conf;
  proxy_pass http://videox_api;
}

location = /robots.txt {
  include /etc/nginx/proxy-headers.conf;
  proxy_pass http://videox_api;
}

location = /admin {
  return 301 /admin/;
}

location = /m {
  return 301 /m/;
}

root /usr/share/nginx/html;

# vite 产物带内容哈希，可以放心长缓存；入口 HTML 必须每次回源判断。
# 只用 add_header，不叠加 expires，否则会发出两个 Cache-Control。
location ~* ^/(assets|m/assets|admin/assets)/ {
  add_header Cache-Control "public, max-age=31536000, immutable";
  include /etc/nginx/hsts.conf;
  access_log off;
  try_files $uri =404;
}

location ~* \.(?:ico|png|jpg|jpeg|gif|webp|avif|svg|woff2?)$ {
  add_header Cache-Control "public, max-age=2592000";
  include /etc/nginx/hsts.conf;
  access_log off;
}

location ~* \.(?:html|webmanifest)$ {
  add_header Cache-Control "no-cache";
  include /etc/nginx/hsts.conf;
}

location /admin/ {
  try_files $uri $uri/ /admin/index.html;
}

location /m/ {
  try_files $uri $uri/ /m/index.html;
}

location / {
  # location 里任何 add_header 都会盖掉 server 级 HSTS，这里一并带上。
  include /etc/nginx/hsts.conf;
  add_header Vary "User-Agent" always;

  # if + return 是 nginx 允许的安全写法。/m 与 /admin 由更具体的 location 接手，不会进这里。
  if ($is_mobile) {
    return 302 /m$request_uri;
  }

  try_files $uri $uri/ /index.html;
}
